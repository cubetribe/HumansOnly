name: Deploy HumansOnly

on:
  push:
    branches:
      - main
    paths:
      - "app/**"
      - "scripts/deploy-server.sh"
      - ".github/workflows/deploy.yml"
      - "docs/DEPLOYMENT.md"
      - "README.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-humansonly-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      DEPLOY_PORT: "2222"
      PUBLIC_HEALTH_URL: "https://humans-only.de/"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate deploy configuration
        id: config
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          set -euo pipefail

          missing=()
          for key in DEPLOY_SSH_KEY DEPLOY_HOST DEPLOY_USER DEPLOY_PATH; do
            if [[ -z "${!key:-}" ]]; then
              missing+=("$key")
            fi
          done

          if (( ${#missing[@]} > 0 )); then
            echo "Missing required deploy secrets: ${missing[*]}" >&2
            exit 1
          fi

          echo "deploy_host=${DEPLOY_HOST}" >> "$GITHUB_OUTPUT"
          echo "deploy_user=${DEPLOY_USER}" >> "$GITHUB_OUTPUT"
          echo "deploy_path=${DEPLOY_PATH}" >> "$GITHUB_OUTPUT"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: app/package-lock.json

      - name: Build and lint app
        working-directory: app
        env:
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
          SKIP_CLERK_CI_BUILD: "1"
        run: |
          set -euo pipefail
          export NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY="${NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY:-pk_test_ci_placeholder}"
          export CLERK_SECRET_KEY="${CLERK_SECRET_KEY:-sk_test_ci_placeholder}"
          npm ci
          npm run lint
          npm run build

      - name: Configure SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H -p "${DEPLOY_PORT}" "$DEPLOY_HOST" >> ~/.ssh/known_hosts

      - name: Write release metadata
        run: |
          set -euo pipefail
          mkdir -p app/.deploy
          {
            echo "sha=${GITHUB_SHA}"
            echo "run_id=${GITHUB_RUN_ID}"
            echo "run_number=${GITHUB_RUN_NUMBER}"
            echo "deployed_at_utc=$(date -u +"%Y-%m-%dT%H:%M:%SZ")"
          } > app/.deploy/release.txt

      - name: Sync app files
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          set -euo pipefail
          rsync -az --delete --stats \
            --exclude ".git" \
            --exclude "node_modules" \
            --exclude ".next" \
            --exclude ".env" \
            --exclude ".env.local" \
            --exclude ".env.backup*" \
            --exclude "public/uploads" \
            -e "ssh -i ~/.ssh/id_ed25519 -p ${DEPLOY_PORT} -o StrictHostKeyChecking=yes" \
            app/ "${DEPLOY_USER}@${DEPLOY_HOST}:${DEPLOY_PATH}/"

      - name: Run remote deploy commands
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          set -euo pipefail

          ssh -i ~/.ssh/id_ed25519 -p "${DEPLOY_PORT}" "${DEPLOY_USER}@${DEPLOY_HOST}" "bash -s" <<EOF
          set -euo pipefail

          echo "Starting remote deployment on \$(hostname) at \$(date -u +\"%Y-%m-%dT%H:%M:%SZ\")"
          cd "${DEPLOY_PATH}"

          npm ci
          cd src
          npx prisma migrate deploy
          npx prisma generate
          cd ..
          npm run build

          NODE_ENV=production pm2 restart humansonly --update-env
          pm2 save

          for attempt in {1..20}; do
            HTTP_CODE=\$(curl -sS -o /tmp/humansonly_health.html -w '%{http_code}' http://127.0.0.1:3001/ || true)
            echo "Internal health attempt \${attempt}/20 -> HTTP \${HTTP_CODE}"
            if [[ "\${HTTP_CODE}" == "200" ]]; then
              echo "Internal health check passed."
              exit 0
            fi
            sleep 3
          done

          echo "Health probe failed after retries." >&2
          pm2 status humansonly --no-color || true
          pm2 logs humansonly --lines 120 --nostream || true
          exit 1
          EOF

      - name: Verify remote service status
        id: remote_status
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          set -euo pipefail

          REMOTE_HTTP_CODE=$(ssh -i ~/.ssh/id_ed25519 -p "${DEPLOY_PORT}" "${DEPLOY_USER}@${DEPLOY_HOST}" "curl -sS -o /tmp/humansonly_remote_health.html -w '%{http_code}' http://127.0.0.1:3001/ || true")
          REMOTE_PM2_STATUS=$(ssh -i ~/.ssh/id_ed25519 -p "${DEPLOY_PORT}" "${DEPLOY_USER}@${DEPLOY_HOST}" "pm2 jlist | tr -d '\\n' | sed 's/},{/},\\n{/g' | grep '\"name\":\"humansonly\"' | head -n1 | sed -n 's/.*\"status\":\"\\([^\"]*\\)\".*/\\1/p' || true")

          REMOTE_PM2_STATUS=${REMOTE_PM2_STATUS:-unknown}

          echo "remote_http_code=${REMOTE_HTTP_CODE}" >> "$GITHUB_OUTPUT"
          echo "remote_pm2_status=${REMOTE_PM2_STATUS}" >> "$GITHUB_OUTPUT"

          echo "Remote health HTTP code: ${REMOTE_HTTP_CODE}"
          echo "Remote pm2 status: ${REMOTE_PM2_STATUS}"

          if [[ "${REMOTE_HTTP_CODE}" != "200" ]]; then
            echo "Remote health endpoint did not return 200." >&2
            exit 1
          fi

      - name: Verify public endpoint
        id: public_status
        run: |
          set -euo pipefail

          PUBLIC_HTTP_CODE=$(curl -L -sS -o /tmp/humansonly_public_health.html -w '%{http_code}' "${PUBLIC_HEALTH_URL}" || true)
          PUBLIC_SERVER=$(curl -L -sSI "${PUBLIC_HEALTH_URL}" | awk -F': ' 'tolower($1)=="server" {print $2; exit}' | tr -d '\\r')

          PUBLIC_SERVER=${PUBLIC_SERVER:-unknown}

          echo "public_http_code=${PUBLIC_HTTP_CODE}" >> "$GITHUB_OUTPUT"
          echo "public_server=${PUBLIC_SERVER}" >> "$GITHUB_OUTPUT"

          echo "Public health URL: ${PUBLIC_HEALTH_URL}"
          echo "Public HTTP code: ${PUBLIC_HTTP_CODE}"
          echo "Public Server header: ${PUBLIC_SERVER}"

          if [[ "${PUBLIC_HTTP_CODE}" != "200" ]]; then
            echo "Public endpoint did not return 200." >&2
            exit 1
          fi

      - name: Deployment summary
        if: always()
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          DEPLOY_HOST: ${{ steps.config.outputs.deploy_host }}
          DEPLOY_USER: ${{ steps.config.outputs.deploy_user }}
          DEPLOY_PATH: ${{ steps.config.outputs.deploy_path }}
          REMOTE_HTTP_CODE: ${{ steps.remote_status.outputs.remote_http_code }}
          REMOTE_PM2_STATUS: ${{ steps.remote_status.outputs.remote_pm2_status }}
          PUBLIC_HTTP_CODE: ${{ steps.public_status.outputs.public_http_code }}
          PUBLIC_SERVER: ${{ steps.public_status.outputs.public_server }}
        run: |
          {
            echo "## Deploy Summary"
            echo ""
            echo "| Check | Value |"
            echo "|---|---|"
            echo "| Run | [View run](${RUN_URL}) |"
            echo "| Target host | ${DEPLOY_USER:-n/a}@${DEPLOY_HOST:-n/a}:${DEPLOY_PATH:-n/a} (port ${DEPLOY_PORT}) |"
            echo "| Remote internal health | ${REMOTE_HTTP_CODE:-n/a} |"
            echo "| Remote PM2 status | ${REMOTE_PM2_STATUS:-n/a} |"
            echo "| Public URL | ${PUBLIC_HEALTH_URL} |"
            echo "| Public health | ${PUBLIC_HTTP_CODE:-n/a} |"
            echo "| Public server header | ${PUBLIC_SERVER:-n/a} |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Remote diagnostics on failure
        if: failure()
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          set -euo pipefail

          if [[ -z "${DEPLOY_HOST:-}" || -z "${DEPLOY_USER:-}" ]]; then
            echo "Missing deploy host/user; skipping remote diagnostics."
            exit 0
          fi

          ssh -i ~/.ssh/id_ed25519 -p "${DEPLOY_PORT}" "${DEPLOY_USER}@${DEPLOY_HOST}" "bash -s" <<EOF
          set +e
          echo "=== Remote diagnostics: humansonly ==="
          pm2 status humansonly --no-color
          echo ""
          echo "=== Last humansonly logs (120 lines) ==="
          pm2 logs humansonly --lines 120 --nostream
          echo ""
          echo "=== Release metadata ==="
          cat "${DEPLOY_PATH}/.deploy/release.txt" 2>/dev/null || echo "No release metadata found."
          echo ""
          echo "=== Disk usage ==="
          df -h
          EOF
