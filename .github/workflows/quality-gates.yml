name: Quality Gates

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
    paths:
      - "app/**"
      - "scripts/ci-quality.sh"
      - ".github/workflows/quality-gates.yml"

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
      CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
      SKIP_CLERK_CI_BUILD: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Run quality gate script
        run: |
          set -euo pipefail
          export NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY="${NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY:-pk_test_ci_placeholder}"
          export CLERK_SECRET_KEY="${CLERK_SECRET_KEY:-sk_test_ci_placeholder}"
          ./scripts/ci-quality.sh
